[project]
name = "ha-flow-map"
version = "0.1.0"
description = "Home Assistant integration for mapping automation, script, and scene flows"
requires-python = ">=3.14.2"
dependencies = [
  "homeassistant==2026.6.0",
]

[dependency-groups]
dev = [
  "pytest>=8.4.0",
  "pytest-asyncio>=1.2.0",
  "pytest-cov>=7.0.0",
  "ruff>=0.13.0",
]

[tool.uv]
package = false

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["custom_components"]

[tool.ruff.lint]
select = [
  "B",
  "C4",
  "E",
  "F",
  "I",
  "N",
  "PLC",
  "PLE",
  "PLR",
  "PLW",
  "RUF",
  "SIM",
  "T20",
  "UP",
  "W",
]
ignore = [
  "PLR0913",
  "PLR0912",
  "PLR0915",
  "PLR0917",
]

[tool.ruff.lint.isort]
force-sort-within-sections = true
known-first-party = ["custom_components"]

[tool.ruff.lint.per-file-ignores]
# These Home Assistant component imports are intentionally lazy for compatibility.
"custom_components/ha_flow_map/coordinator.py" = ["PLC0415"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
