name: Development Release

on:
  push:
    branches:
      - develop

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Read development version
        id: version
        run: |
          version="$(jq -r '.version // empty' custom_components/ha_flow_map/manifest.json)"
          test -n "${version}" || { echo "The integration manifest does not define a version." >&2; exit 1; }
          echo "value=${version%-dev}-dev" >> "$GITHUB_OUTPUT"

      - name: Delete existing release
        run: gh release delete "v${DEV_VERSION}" --yes || true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEV_VERSION: ${{ steps.version.outputs.value }}

      - name: Create or update tag
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git tag -f "v${{ steps.version.outputs.value }}"
          git push origin --force "v${{ steps.version.outputs.value }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.version.outputs.value }}
          name: v${{ steps.version.outputs.value }}
          body: This is a development release from develop.
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
